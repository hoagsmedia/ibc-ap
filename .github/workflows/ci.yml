# PR / branch checks. Deployments are handled by Vercel Git integration (see DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main, development, preview]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # src/lib/server/redis.local.test.ts connects in beforeAll; without Redis the hook hangs until Vitest times out.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # GitHub Actions: use Node 24 for JS actions (avoids Node 20 deprecation on runner)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, ESLint, test, production build
        run: pnpm run ci
        env:
          # Ensure build does not pick up optional local DB URL in CI
          DATABASE_URL: ""
